[project]
name = "ganluluo-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "email-validator>=2",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "pwdlib[argon2]>=0.2",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
# Python 3.12+ resumes asyncio-task frames without settrace events, so the legacy
# C tracer undercounts coroutine code (84% vs the real 94%). The sys.monitoring
# core measures it accurately and becomes the default on Python 3.14+.
core = "sysmon"

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# B008: `Depends(...)` in argument defaults is the standard FastAPI DI idiom.
extend-ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
