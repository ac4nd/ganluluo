<script>
/* 环保绿 · 液态玻璃流体能量球
   菲涅尔边缘折射高光 + FBM 噪声域扭曲流体 + 玻璃折射采样，暗色通透融合 */
(function(){
  var cv=document.getElementById('globe');
  if(!cv)return;
  var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gl=cv.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:true})
      ||cv.getContext('experimental-webgl',{alpha:true,premultipliedAlpha:true});

  /* ---------- WebGL 着色器方案 ---------- */
  var FRAG=[
    'precision highp float;',
    'uniform vec2 uRes;uniform float uTime;',
    'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
    'float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);',
    ' return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);}',
    'float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);',
    ' for(int i=0;i<5;i++){v+=a*noise(p);p=m*p;a*=.55;}return v;}',
    'void main(){',
    ' vec2 uv=(gl_FragCoord.xy*2.-uRes)/min(uRes.x,uRes.y);',
    ' float r=length(uv),R=0.70;',
    ' vec3 col=vec3(0.);float alpha=0.;',
    /* 主光（左上）与底部反光方向 */
    ' vec3 L =normalize(vec3(-0.5,0.62,0.42));',
    ' vec3 Lb=normalize(vec3(0.35,-0.52,0.55));',
    ' vec3 deep=vec3(0.030,0.075,0.024);',
    ' vec3 mid =vec3(0.20,0.40,0.125);',
    ' vec3 glow=vec3(0.84,0.98,0.63);',
    /* 绕缘受光系数：受光侧 1.0 → 背光侧 0.45 */
    ' float dir=0.45+0.55*clamp(dot(normalize(vec3(uv,0.42)),L),0.,1.);',
    ' if(r<R){',
    '  float z=sqrt(R*R-r*r);',
    '  vec3 n=vec3(uv,z)/R;',
    '  float limb=r/R;',
    '  float t=uTime*0.12;',
    /* 三层域扭曲 FBM —— 液态流体纹路 */
    '  vec2 p=uv*2.6;',
    '  float q=fbm(p+vec2(t*0.7,-t*0.5));',
    '  float w=fbm(p+2.4*vec2(q+t*0.3,q-t*0.4)+vec2(0.,t));',
    /* 玻璃折射：按折射光线弯曲采样坐标 */
    '  vec3 rd=refract(vec3(0.,0.,-1.),n,0.90);',
    '  vec2 rp=uv+z*rd.xy*0.6;',
    '  float g=fbm(rp*2.3+2.0*vec2(w)+vec2(-t*0.6,t*0.35)+1.3);',
    '  float swirl=clamp(g*1.3-0.22,0.,1.);',
    '  float marble=smoothstep(0.55,0.95,fbm(p*1.4+vec2(t*0.4,0.)+3.1*w));',
    '  col=mix(deep,mid,swirl);',
    '  col=mix(col,glow,marble*0.22);',
    /* 体积感①：径向明暗（中心深、边缘透） */
    '  col*=0.36+0.64*smoothstep(0.,R*0.92,r);',
    /* 体积感②：受光面亮、背光面暗 */
    '  float diff=clamp(dot(n,L),0.,1.);',
    '  col*=0.70+0.40*diff;',
    '  col+=mid*0.16*pow(diff,1.6);',
    /* 体积感③：临边压暗——球面转折处的回旋暗带，把边缘与内部拉开层次 */
    '  col*=1.0-0.42*smoothstep(0.60,0.92,limb);',
    /* 底部环境反光（球底微亮） */
    '  float diffB=clamp(dot(n,Lb),0.,1.);',
    '  col+=mid*0.30*pow(diffB,2.0)*smoothstep(0.45,0.95,limb);',
    /* 菲涅尔边缘辉光：受光侧强、背光侧收敛；颜色掺入中绿以贴合背景 */
    '  float fres=pow(1.-clamp(n.z,0.,1.),3.0);',
    '  col+=mix(glow,mid,0.35)*pow(fres,1.6)*smoothstep(0.4,1.,fres)*dir*0.55;',
    /* 锐利玻璃亮边（细环，强度随受光方向变化） */
    '  float edgeBand=smoothstep(0.956,0.988,limb)*(1.-smoothstep(0.994,1.,limb));',
    '  col+=mix(glow,mid,0.3)*edgeBand*(0.25+0.55*dir);',
    /* 左上镜面高光斑 */
    '  vec3 H=normalize(L+vec3(0.,0.,1.));',
    '  col+=mix(glow,mid,0.25)*pow(clamp(dot(n,H),0.,1.),70.)*0.55;',
    '  alpha=1.-smoothstep(R-0.022,R,r);',
    '  col*=alpha;',
    ' } else {',
    /* 球外贴边溢光：更远更淡，颜色压向暗绿，与背景衔接 */
    '  float o=1.-smoothstep(R*1.004,R*1.28,r);',
    '  col=mix(glow,deep,0.35)*o*o*0.20*(0.30+0.70*dir);',
    '  alpha=o*o*0.38;',
    ' }',
    ' gl_FragColor=vec4(col,alpha);',
    '}'].join('\n');

  var VSRC='attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}';
  /* 兜底着色器：纯渐变玻璃球（主着色器编译失败时自动启用） */
  var SIMPLE_FRAG=[
    'precision mediump float;',
    'uniform vec2 uRes;',
    'void main(){',
    ' vec2 uv=(gl_FragCoord.xy*2.-uRes)/min(uRes.x,uRes.y);',
    ' float r=length(uv),R=0.70;',
    ' vec3 col=vec3(0.);float alpha=0.;',
    ' if(r<R){',
    '  float z=sqrt(R*R-r*r);',
    '  vec3 n=vec3(uv,z)/R;',
    '  float fres=pow(1.-clamp(n.z,0.,1.),3.);',
    '  col=mix(vec3(0.04,0.10,0.03),vec3(0.20,0.40,0.125),r/R);',
    '  col+=vec3(0.84,0.98,0.63)*smoothstep(0.6,1.,fres)*0.9;',
    '  alpha=1.-smoothstep(R-0.009,R,r);',
    '  col*=alpha;',
    ' }',
    ' gl_FragColor=vec4(col,alpha);',
    '}'].join('\n');
  function shader(type,src){
    var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null;}
    return s;
  }
  function makeProgram(fragSrc){
    var vs=shader(gl.VERTEX_SHADER,VSRC);
    var fs=shader(gl.FRAGMENT_SHADER,fragSrc);
    if(!vs||!fs)return null;
    var pr=gl.createProgram();
    gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
    return gl.getProgramParameter(pr,gl.LINK_STATUS)?pr:null;
  }
  function useProgram(pr){
    gl.useProgram(pr);
    var buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(pr,'aP');
    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.viewport(0,0,cv.width,cv.height);
    gl.uniform2f(gl.getUniformLocation(pr,'uRes'),cv.width,cv.height);
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    return gl.getUniformLocation(pr,'uTime');
  }
  /* ---------- Canvas 2D 降级（仅在从未取得 WebGL 上下文时可用） ---------- */
  function fallbackCanvas(){
    var ctx=cv.getContext('2d');
    if(!ctx)return;
    function frame(now){
      var t=REDUCED?8:now*0.001,S=cv.width,C=S/2,R=C*0.70;
      ctx.clearRect(0,0,S,S);
      var g=ctx.createRadialGradient(C,C,0,C,C,R);
      g.addColorStop(0,'#07130a');g.addColorStop(.55,'#12240c');
      g.addColorStop(.85,'#2c5218');g.addColorStop(1,'#9ed45e');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(C,C,R,0,6.283);ctx.fill();
      ctx.save();ctx.beginPath();ctx.arc(C,C,R*0.985,0,6.283);ctx.clip();ctx.globalAlpha=.16;
      for(var i=0;i<4;i++){
        var a=t*0.25+i*1.7,rx=R*(0.34+0.3*((i*37)%50)/50);
        var x=C+Math.cos(a)*R*0.32,y=C+Math.sin(a*0.8)*R*0.32;
        ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(1,0.55);
        var sg=ctx.createRadialGradient(0,0,0,0,0,rx);
        sg.addColorStop(0,'rgba(190,235,120,0.95)');sg.addColorStop(1,'rgba(190,235,120,0)');
        ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,rx,0,6.283);ctx.fill();ctx.restore();
      }
      ctx.restore();
      var ring=ctx.createRadialGradient(C,C,R*0.84,C,C,R);
      ring.addColorStop(0,'rgba(163,241,80,0)');ring.addColorStop(.85,'rgba(163,241,80,.5)');
      ring.addColorStop(1,'rgba(224,255,168,.95)');
      ctx.fillStyle=ring;ctx.beginPath();ctx.arc(C,C,R,0,6.283);ctx.fill();
      if(!REDUCED)requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  var uTimeLoc=null;
  if(!gl){fallbackCanvas();return;}
  var pr=makeProgram(FRAG)||makeProgram(SIMPLE_FRAG);
  if(!pr)return;
  uTimeLoc=useProgram(pr);
  function draw(now){
    gl.uniform1f(uTimeLoc,REDUCED?8.0:now*0.001);
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!REDUCED)requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
