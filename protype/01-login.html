<link rel="stylesheet" href="assets/style.css">
<style>
  .globe-wrap{position:relative;width:332px;height:332px;margin:0 auto}
  .globe-wrap::before{content:"";position:absolute;inset:-150px;border-radius:50%;z-index:0;
    background:radial-gradient(circle,rgba(164,241,80,.09) 0%,rgba(164,241,80,.03) 45%,transparent 66%)}
  .globe-wrap canvas{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:1}
  .globe-halo{position:absolute;inset:-60px;border-radius:50%;z-index:0;
    background:radial-gradient(circle,rgba(164,241,80,.10) 0%,rgba(164,241,80,.04) 40%,transparent 68%)}
  /* 上次登录用户头像框（有登录记录时替代球体） */
  #state-avatar{display:none}
  .avatar-hi{position:relative;width:176px;height:176px;margin:0 auto}
  .avatar-hi::before{content:"";position:absolute;inset:-52px;border-radius:50%;
    background:radial-gradient(circle,rgba(164,241,80,.18) 0%,rgba(164,241,80,.06) 42%,transparent 68%)}
  .avatar-ring{position:absolute;inset:0;border-radius:50%;padding:6px;
    background:conic-gradient(from 210deg,rgba(224,255,168,.95),rgba(164,241,80,.18) 22%,rgba(255,255,255,.10) 45%,rgba(164,241,80,.35) 68%,rgba(224,255,168,.95));
    box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 44px rgba(140,235,80,.3),inset 0 1px 0 rgba(255,255,255,.45)}
  .avatar-face{position:absolute;inset:6px;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 34% 26%,#8fe14b 0%,#3f7a26 46%,#17311c 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:58px;font-weight:800;color:#0d1506;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 12px 26px rgba(0,0,0,.35)}
  .avatar-face::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:linear-gradient(148deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.05) 28%,transparent 48%)}
  .hi-name{margin-top:14px;text-align:center;font-size:12.5px;color:var(--muted)}
  .hi-name b{color:var(--text);font-weight:700}
  .demo-toggle{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}
  .demo-toggle a{color:var(--dim);text-decoration:underline}
</style>

<script>
/* 登录状态：有上次登录记录 → 头像展示框；未登录过 → 液态玻璃能量球 */
(function(){
  var KEY='gl_last_user';
  /* URL 参数 ?state=avatar|globe 用于原型演示与评审截图 */
  try{
    var q=new URLSearchParams(location.search).get('state');
    if(q==='avatar')localStorage.setItem(KEY,JSON.stringify({name:'晨风',mail:'hiker@example.com'}));
    else if(q==='globe')localStorage.removeItem(KEY);
  }catch(e){}

  var user=null;
  try{user=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  var has=!!(user&&user.name);
  window.__GL_SHOW_GLOBE=!has;

  var g=document.getElementById('state-globe'),a=document.getElementById('state-avatar');
  if(has){
    g.style.display='none';a.style.display='block';
    var n=document.getElementById('hiName');
    n.innerHTML='<b></b> · 上次登录';
    n.querySelector('b').textContent=user.name;
    var t=document.getElementById('ctaText');
    if(t)t.textContent='继续，以「'+user.name+'」登录';
  }
})();
function glRemember(){
  try{localStorage.setItem('gl_last_user',JSON.stringify({name:'晨风',mail:'hiker@example.com'}))}catch(e){}
}
function glToggleDemo(){
  try{
    var k='gl_last_user';
    if(localStorage.getItem(k))localStorage.removeItem(k);
    else localStorage.setItem(k,JSON.stringify({name:'晨风',mail:'hiker@example.com'}));
  }catch(e){}
  location.reload();
}
</script>

<script>
/* 环保绿 · 地球轮廓 + 探险航线
   思路学习自掘金 geoJson 线框地球（three.js），此处以 Canvas2D 零依赖重写：
   经纬网格 + 简化大陆轮廓线稿（正/背面分层）+ 世界著名景点脉冲 + 大圆航线流光。
   支持拖拽旋转（松手惯性衰减，自动自转恢复）；prefers-reduced-motion 输出静帧。 */
(function () {
  if (!window.__GL_SHOW_GLOBE) return;
  var cv = document.getElementById('globe');
  if (!cv || !cv.getContext) return;
  var x = cv.getContext('2d');
  var S = cv.width, CX = S / 2, CY = S / 2, R = S * 0.435;
  var DR = Math.PI / 180, TAU = Math.PI * 2;
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ACC = '164,241,80', GLOW = '224,255,168', DIM = '150,200,110';

  /* —— 简化大陆/岛屿轮廓（lon,lat 序列，低精度识别用） —— */
  var CONT = [
    /* 亚欧主大陆 */
    [-9,38,-9,43,-2,47,0,49,4,52,7,54,9,57,12,56,18,55,21,57,24,60,28,60,26,65,20,69,30,70,45,68,60,69,73,73,86,74,105,77,113,74,130,71,150,70,170,67,178,65,172,61,163,58,157,52,142,54,136,45,129,40,126,35,121,31,117,24,109,18,105,9,103,2,101,6,98,12,95,16,91,22,87,21,80,13,77,8,73,16,70,21,66,25,60,25,57,27,52,25,56,22,59,20,54,13,45,12,43,13,39,17,35,28,34,33,36,36,30,37,26,39,22,41,16,42,13,45,8,44,3,43,0,40,-6,36],
    /* 非洲 */
    [32,31,34,28,37,22,43,12,48,11,51,12,45,2,40,-3,39,-11,36,-18,33,-26,26,-34,19,-35,15,-28,12,-18,13,-11,9,-1,9,4,3,6,-4,5,-8,4,-13,9,-17,15,-16,20,-13,27,-9,32,-6,35,-2,35,0,36,10,37,20,32,25,32],
    /* 北美 */
    [-168,66,-162,70,-156,71,-140,70,-128,70,-115,69,-105,69,-95,72,-85,70,-82,66,-75,62,-70,60,-65,60,-60,56,-64,50,-70,47,-74,45,-76,40,-75,35,-81,31,-80,26,-84,30,-89,30,-94,29,-97,26,-97,22,-94,18,-91,16,-87,15,-83,10,-79,9,-83,8,-86,12,-92,15,-96,16,-105,20,-110,24,-114,28,-117,33,-122,37,-124,42,-124,48,-128,52,-132,56,-140,60,-148,61,-154,59,-162,58,-166,62],
    /* 南美 */
    [-77,8,-75,10,-71,12,-64,11,-60,8,-52,5,-50,0,-44,-3,-38,-5,-35,-8,-39,-14,-40,-20,-48,-26,-53,-33,-58,-38,-62,-41,-65,-45,-68,-52,-72,-54,-74,-50,-73,-44,-73,-37,-71,-30,-70,-22,-70,-18,-76,-14,-81,-6,-81,-1,-77,4],
    /* 澳洲 */
    [113,-22,114,-26,116,-32,119,-34,124,-33,129,-32,132,-32,136,-35,138,-35,141,-38,146,-39,150,-37,153,-31,153,-26,151,-24,147,-19,143,-15,142,-11,137,-12,136,-14,132,-11,128,-15,124,-16,122,-18,118,-20,114,-22],
    /* 格陵兰 */
    [-45,60,-42,62,-40,65,-38,66,-32,68,-25,70,-22,70,-25,73,-33,76,-40,77,-50,79,-58,76,-62,74,-58,72,-54,70,-52,66,-48,61],
    /* 英伦 */
    [-5,50,-3,53,-5,56,-3,58,-1,57,1,53,0,51],
    /* 日本 */
    [130,31,132,34,136,35,140,36,141,40,142,44,145,44,143,42,140,38,137,36,133,34],
    /* 苏门答腊-爪哇 */
    [95,5,99,2,103,-2,106,-6,110,-7,114,-8,112,-5,105,0,97,3],
    /* 马达加斯加 */
    [49,-12,50,-16,48,-22,45,-25,44,-20,46,-15],
    /* 新西兰（两岛简化） */
    [173,-35,176,-38,174,-41,171,-44,167,-46,170,-44,173,-41,174,-38]
  ];
  /* —— 世界著名景点（世界探险航线节点） —— */
  var SPOTS = [
    { n: '长城 · 中国', lon: 116, lat: 40 },
    { n: '富士山 · 日本', lon: 138, lat: 35 },
    { n: '大堡礁 · 澳洲', lon: 147, lat: -18 },
    { n: '悉尼歌剧院', lon: 151, lat: -34 },
    { n: '乌鲁鲁', lon: 131, lat: -25 },
    { n: '泰姬陵 · 印度', lon: 78, lat: 27 },
    { n: '珠穆朗玛峰', lon: 87, lat: 28 },
    { n: '贝加尔湖', lon: 108, lat: 53 },
    { n: '撒哈拉沙漠', lon: 10, lat: 23 },
    { n: '金字塔 · 埃及', lon: 31, lat: 30 },
    { n: '圣托里尼', lon: 25, lat: 36 },
    { n: '埃菲尔铁塔 · 巴黎', lon: 2, lat: 49 },
    { n: '冰岛极光', lon: -19, lat: 65 },
    { n: '尼亚加拉瀑布', lon: -79, lat: 43 },
    { n: '大峡谷 · 美国', lon: -112, lat: 36 },
    { n: '马丘比丘 · 秘鲁', lon: -72, lat: -13 },
    { n: '巴塔哥尼亚', lon: -71, lat: -46 },
    { n: '乞力马扎罗', lon: 37, lat: -3 }
  ];
  /* 航线：按上表顺序串联成环球环线 */
  var ROUTE = SPOTS.map(function (_, i) { return i; });

  function v3(lon, lat, lift) {
    var p = lat * DR, l = lon * DR;
    var k = 1 + (lift || 0);
    return [Math.cos(p) * Math.sin(l) * k, Math.sin(p) * k, Math.cos(p) * Math.cos(l) * k];
  }
  /* 预计算：轮廓点列 / 景点 / 航线弧采样（大圆插值 + 抬升） */
  var LAND = CONT.map(function (poly) {
    var pts = [];
    for (var i = 0; i < poly.length; i += 2) pts.push(v3(poly[i], poly[i + 1]));
    pts.push(pts[0]);
    return pts;
  });
  var SPV = SPOTS.map(function (s) { return v3(s.lon, s.lat, 0.012); });
  var ARCS = [];
  for (var i = 0; i < ROUTE.length; i++) {
    var A = SPV[ROUTE[i]], B = SPV[ROUTE[(i + 1) % ROUTE.length]];
    var w = Math.acos(Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2]))) || .001;
    var pts = [];
    for (var k = 0; k <= 30; k++) {
      var u = k / 30, lift = 0.16 * Math.sin(Math.PI * u);
      var sa = Math.sin((1 - u) * w) / Math.sin(w), sb = Math.sin(u * w) / Math.sin(w);
      pts.push([A[0] * sa + B[0] * sb, A[1] * sa + B[1] * sb, A[2] * sa + B[2] * sb, 1 + lift]);
    }
    ARCS.push(pts);
  }
  /* 预计算经纬网格几何 */
  var MERID = [], PARAL = [];
  for (var lon = 0; lon < 360; lon += 20) {
    var m = [];
    for (var lat = -80; lat <= 80; lat += 5) m.push(v3(lon, lat));
    MERID.push(m);
  }
  for (lat = -60; lat <= 75; lat += 15) {
    var pa = [];
    for (lon = 0; lon <= 360; lon += 6) pa.push(v3(lon, lat));
    PARAL.push(pa);
  }

  function project(p, rot, tilt) {
    var cr = Math.cos(rot), sr = Math.sin(rot);
    var xx = p[0] * cr + p[2] * sr, z1 = -p[0] * sr + p[2] * cr;
    var ct = Math.cos(tilt), st = Math.sin(tilt);
    var yy = p[1] * ct - z1 * st, zz = p[1] * st + z1 * ct;
    return [CX + xx * R, CY - yy * R, zz];
  }
  function strokePoly(pts, rot, tilt, frontCol, backCol, width, glow) {
    for (var pass = 0; pass < 2; pass++) {
      x.beginPath();
      var started = false, pz = 0;
      for (var i = 0; i < pts.length; i++) {
        var v = project(pts[i], rot, tilt);
        var front = v[2] > 0;
        if ((pass === 0) === front) { // pass0=背面 pass1=正面
          if (!started) { x.moveTo(v[0], v[1]); started = true; } else x.lineTo(v[0], v[1]);
          pz = v[2];
        } else { started = false; }
      }
      x.strokeStyle = pass === 0 ? backCol : frontCol;
      x.lineWidth = width * (pass === 0 ? .8 : 1);
      x.shadowBlur = pass === 1 && glow ? 6 : 0;
      x.shadowColor = pass === 1 && glow ? 'rgba(' + ACC + ',.6)' : 'transparent';
      x.stroke(); x.shadowBlur = 0;
    }
  }

  /* 交互：拖拽旋转 + 惯性 + 自转恢复 */
  var rot = 0.9, tilt = -0.42, vel = 0, dragging = false, lastX = 0, lastY = 0, idle = 0;
  cv.style.touchAction = 'none';
  cv.addEventListener('pointerdown', function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    rot += dx * 0.006; vel = dx * 0.006;
    tilt = Math.max(-1.1, Math.min(1.1, tilt + dy * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  cv.addEventListener('pointerup', function () { dragging = false; });
  cv.addEventListener('pointercancel', function () { dragging = false; });

  function draw(now) {
    var t = REDUCED ? 4 : now / 1000;
    if (!dragging) { rot += 0.0016 + vel; vel *= 0.94; }
    x.clearRect(0, 0, S, S);
    /* 球内底：暗色玻璃圆底，保证线稿在任意视频背景上清晰 */
    var bg = x.createRadialGradient(CX - R * .25, CY - R * .3, 0, CX, CY, R);
    bg.addColorStop(0, 'rgba(8,14,6,.78)'); bg.addColorStop(.72, 'rgba(7,12,5,.66)'); bg.addColorStop(1, 'rgba(6,10,5,.55)');
    x.fillStyle = bg; x.beginPath(); x.arc(CX, CY, R, 0, TAU); x.fill();
    /* 外圈轮廓 */
    x.strokeStyle = 'rgba(' + ACC + ',.6)'; x.lineWidth = 1.6;
    x.shadowBlur = 14; x.shadowColor = 'rgba(' + ACC + ',.55)';
    x.beginPath(); x.arc(CX, CY, R, 0, TAU); x.stroke(); x.shadowBlur = 0;
    /* 经纬网格（正面） */
    x.strokeStyle = 'rgba(' + ACC + ',.10)'; x.lineWidth = 1;
    for (var i = 0; i < MERID.length; i++) strokePoly(MERID[i], rot, tilt, 'rgba(' + ACC + ',.12)', 'rgba(' + ACC + ',.035)', 1, false);
    for (i = 0; i < PARAL.length; i++) strokePoly(PARAL[i], rot, tilt, 'rgba(' + ACC + ',.12)', 'rgba(' + ACC + ',.035)', 1, false);
    /* 大陆轮廓：背面淡透 → 正面发光 */
    for (i = 0; i < LAND.length; i++) strokePoly(LAND[i], rot, tilt, 'rgba(210,246,150,.92)', 'rgba(' + ACC + ',.10)', 1.4, true);
    /* 探险航线弧 + 流光 */
    for (i = 0; i < ARCS.length; i++) {
      var pts = ARCS[i], flow = (t * .28 + i * .37) % 1;
      for (var pass = 0; pass < 2; pass++) {
        x.beginPath();
        var started = false;
        for (var k = 0; k < pts.length; k++) {
          var v = project(pts[k], rot, tilt);
          var front = v[2] > 0;
          if ((pass === 0) === front) {
            if (!started) { x.moveTo(v[0], v[1]); started = true; } else x.lineTo(v[0], v[1]);
          } else started = false;
        }
        x.strokeStyle = pass === 0 ? 'rgba(' + ACC + ',.10)' : 'rgba(' + GLOW + ',.42)';
        x.lineWidth = pass === 0 ? 1 : 1.5;
        x.stroke();
      }
      /* 流光点 */
      var fi = Math.floor(flow * 30), fr = flow * 30 - fi;
      var A = pts[fi], B = pts[Math.min(fi + 1, 30)];
      var fp = [lerp(A[0], B[0], fr), lerp(A[1], B[1], fr), lerp(A[2], B[2], fr), lerp(A[3], B[3], fr)];
      var v = project(fp, rot, tilt);
      if (v[2] > 0) {
        x.fillStyle = 'rgba(' + GLOW + ',.95)';
        x.shadowBlur = 8; x.shadowColor = 'rgba(' + ACC + ',.8)';
        x.beginPath(); x.arc(v[0], v[1], 2, 0, TAU); x.fill(); x.shadowBlur = 0;
      }
    }
    /* 景点：脉冲 + 标名 */
    for (i = 0; i < SPV.length; i++) {
      var sv = SPV[i];
      var v = project(sv, rot, tilt);
      if (v[2] <= 0.05) continue;
      var al = clamp((v[2] - .05) / .5, 0, 1);
      var pr = 3 + Math.sin(t * 2.4 + i * 1.3) * 1.4;
      x.strokeStyle = 'rgba(' + ACC + ',' + (.7 * al).toFixed(2) + ')'; x.lineWidth = 1.2;
      x.beginPath(); x.arc(v[0], v[1], pr, 0, TAU); x.stroke();
      x.fillStyle = 'rgba(' + GLOW + ',' + al.toFixed(2) + ')';
      x.beginPath(); x.arc(v[0], v[1], 2, 0, TAU); x.fill();
      if (v[2] > .3) {
        x.fillStyle = 'rgba(' + GLOW + ',' + (al * .85).toFixed(2) + ')';
        x.font = '600 9px sans-serif'; x.textAlign = 'center';
        x.fillText(SPOTS[i].n, v[0], v[1] - 8);
      }
    }
  }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  if (REDUCED) { draw(4000); return; }
  (function loop(now) { draw(now); requestAnimationFrame(loop); })(performance.now());
})();
</script>
</body>
</html>
